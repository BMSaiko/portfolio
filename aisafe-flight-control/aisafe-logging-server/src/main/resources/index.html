<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISafe – Remote Access Logs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f1117;
            color: #c9d1d9;
            min-height: 100vh;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.2rem;
            color: #58a6ff;
            letter-spacing: 1px;
        }

        nav a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border: 1px solid #30363d;
            border-radius: 6px;
            transition: background 0.2s;
        }

        nav a:hover { background: #21262d; }

        .container { padding: 28px 32px; }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #event-count {
            margin-left: auto;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 0.8rem;
            color: #8b949e;
        }

        .table-wrapper {
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead tr {
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #21262d;
            transition: background 0.15s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #161b22; }

        td { padding: 10px 14px; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: #0d4429; color: #3fb950; }
        .badge-failure { background: #3d1f1f; color: #f85149; }
        .badge-logout  { background: #1f2d3d; color: #58a6ff; }
        .badge-disconnect { background: #2d2116; color: #e3b341; }

        .service-tag {
            font-family: monospace;
            font-size: 0.8rem;
            color: #79c0ff;
        }

        #empty-msg {
            text-align: center;
            padding: 48px;
            color: #484f58;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🛡️ AISafe — Remote Access Logs</h1>
    <nav><a href="/active">Active Sessions →</a></nav>
</header>

<div class="container">
    <div class="status-bar">
        <div class="dot"></div>
        <span>Live – auto-refreshing every 3 seconds</span>
        <span id="event-count">0 events</span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Timestamp</th>
                <th>Username</th>
                <th>Client IP</th>
                <th>Port</th>
                <th>Service</th>
                <th>Event</th>
            </tr>
            </thead>
            <tbody id="logs-body">
            <tr><td colspan="6" id="empty-msg">Waiting for events...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function badgeClass(event) {
        if (event === 'LOGIN_SUCCESS')  return 'badge badge-success';
        if (event === 'LOGIN_FAILURE')  return 'badge badge-failure';
        if (event === 'LOGOUT')         return 'badge badge-logout';
        if (event === 'DISCONNECT')     return 'badge badge-disconnect';
        return 'badge';
    }

    function fetchLogs() {
        fetch('/api/logs')
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('logs-body');
                document.getElementById('event-count').textContent = data.length + ' events';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" id="empty-msg">No events recorded yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.reverse().map(e => `
                    <tr>
                        <td>${e.timestamp}</td>
                        <td>${e.username}</td>
                        <td>${e.clientIp}</td>
                        <td>${e.clientPort}</td>
                        <td><span class="service-tag">${e.service}</span></td>
                        <td><span class="${badgeClass(e.event)}">${e.event}</span></td>
                    </tr>`).join('');
            })
            .catch(() => {});
    }

    fetchLogs();
    setInterval(fetchLogs, 3000);
</script>
</body>
</html>
