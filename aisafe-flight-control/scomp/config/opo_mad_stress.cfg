# Cenario stress -- OPO para MAD, 8 voos
# Voos agrupados por offset lateral:
#   offset 0.0 graus: AA100, AA103, AA120, AA123  (sobrepõem-se -> violacoes)
#   offset 0.5 graus: AA101, AA121               (sobrepõem-se -> violacoes)
#   offset 1.0 graus: AA102, AA122               (sobrepõem-se -> violacoes)
# safety_threshold=100km garante violacoes entre voos do mesmo grupo
# violation_count >= 3 resulta em terminacao de processo

area_code=OPO_MAD_STRESS
lat_min=39.0
lat_max=43.5
lon_min=-9.5
lon_max=-2.5
max_altitude=14000.0
time_start=0
time_end=3600
time_step_secs=60
safety_threshold=100
num_flights=8
flights=AA100,AA101,AA102,AA103,AA120,AA121,AA122,AA123