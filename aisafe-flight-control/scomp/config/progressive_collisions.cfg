# Cenario de colisoes progressivas -- para demonstrar US102
#
# 3 voos na mesma rota com offsets diferentes:
#   AA123: offset 0.0 graus
#   AA124: offset 0.5 graus (~55km de AA123)
#   AA125: offset 1.0 graus (~55km de AA124, ~110km de AA123)
#
# Com safety_threshold=70km:
#   AA123 vs AA124: ~55km -> viola sempre (1 violacao/step cada)
#   AA124 vs AA125: ~55km -> viola sempre (1 violacao/step cada)
#   AA123 vs AA125: ~110km -> nunca viola
#
# Resultado esperado:
#   AA124 acumula 2 violacoes/step (vs AA123 e vs AA125)
#   -> chega a 3 violacoes ao step 1 -> SIGTERM
#   AA123 e AA125 acumulam 1 violacao/step
#   -> chegam a 3 violacoes ao step 2 -> SIGTERM

area_code=OPO_MAD
lat_min=40.0
lat_max=43.5
lon_min=-9.0
lon_max=-3.0
max_altitude=14000.0
time_start=0
time_end=3600
time_step_secs=60
safety_threshold=70
num_flights=3
flights=AA123,AA124,AA125