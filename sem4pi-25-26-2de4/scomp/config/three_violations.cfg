# Cenario de 3 violacoes progressivas -- demonstra terminacao por SIGTERM
#
# Dois voos na rota OPO->MAD com offset de 0.5 graus (~55km).
# Com safety_threshold=56km, os voos violam durante o cruise
# (onde a distancia e constante ~55km).
# Apos 3 violacoes consecutivas cada voo recebe SIGTERM.

area_code=OPO_MAD
lat_min=40.0
lat_max=43.5
lon_min=-9.0
lon_max=-3.0
max_altitude=14000.0
time_start=0
time_end=3600
time_step_secs=60
safety_threshold=70
num_flights=2
flights=AA123,AA124